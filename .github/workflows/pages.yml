# Publishes notyga.fr through GitHub Pages.
#
# Pages serves this repository on the custom domain notyga.fr, i.e. from the
# root of the domain, so it deploys the PRODUCTION build (paths rooted at /,
# indexable). The custom domain itself is set in Settings -> Pages.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Deploy notyga.fr to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and keep the newest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only, so there is nothing to install.
      - name: Build the production site
        run: |
          python tools/build_pages.py --target production --out _site
          cp CNAME _site/

      - name: Check no link points at the old /notyga/ subpath
        run: |
          if grep -rE '(href|src)="/notyga/' _site --include='*.html'; then
            echo "::error::found a link to the /notyga/ subpath"
            exit 1
          fi
          echo "no link points at /notyga/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
